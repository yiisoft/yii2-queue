name: build

permissions:
  contents: read

on:
  pull_request:
    paths-ignore: &ignore-paths
      - 'docs/**'
      - '.github/CONTRIBUTING.md'
      - '.github/FUNDING.yml'
      - '.github/SECURITY.md'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE.md'
      - 'UPGRADE.md'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'phpunit.xml.dist'

  push:
    branches: [ 'master' ]
    paths-ignore: *ignore-paths

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5' ]
    steps:
      - name: Checkout.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: PHP Unit tests for PHP ${{ matrix.php }}
        run: make test v=${{ matrix.php }}

      - name: Upload coverage to Codecov.
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
